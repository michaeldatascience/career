<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael — Career Tracker</title>
<style>
:root{--bg:#0D1117;--card:#161B22;--hover:#1C2128;--border:#30363D;--text:#E6EDF3;--muted:#8B949E;--dim:#484F58;
--accent:#58A6FF;--accent-d:rgba(88,166,255,.12);--yellow:#D29922;--yellow-d:rgba(210,153,34,.15);--green:#3FB950;--green-d:rgba(63,185,80,.12);
--red:#F85149;--red-d:rgba(248,81,73,.12);--grey-d:rgba(139,148,158,.12);--purple:#A371F7;--purple-d:rgba(163,113,247,.15);
--mono:'SF Mono','Fira Code',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:200px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-h{padding:18px 16px 14px;border-bottom:1px solid var(--border)}.side-h b{font-size:13px}.side-h div{font-size:11px;color:var(--muted)}
.nav{padding:10px 8px;flex:1}
.nav-i{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
.nav-i:hover{background:var(--hover);color:var(--text)}.nav-i.on{background:var(--accent-d);color:var(--accent)}
.cnt{margin-left:auto;font-size:11px;background:var(--hover);padding:1px 6px;border-radius:10px}
.side-f{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)}
.main{flex:1;overflow-y:auto}
.page{display:none;padding:24px 28px}.page.on{display:block}
.ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.ph h1{font-size:18px}.ph p{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.fb{padding:3px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:none;color:var(--muted)}
.fb:hover{color:var(--text)}.fb.on{border-color:var(--accent);color:var(--accent);background:var(--accent-d)}
.tog{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:12px;padding:8px 12px;border:1px dashed var(--border);border-radius:6px}
.legend span b{color:var(--text)}
.tw{border:1px solid var(--border);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
th{background:var(--card);padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12.5px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--hover)}tbody tr:last-child td{border-bottom:none}
tr.amber{background:rgba(210,153,34,.06)}tr.red{background:rgba(248,81,73,.05)}tr.blocked{opacity:.45}
tr.sel{outline:1px solid var(--accent);outline-offset:-1px}
.nm{font-weight:500;font-size:13px}.org{font-size:11px;color:var(--muted)}
.dl{font-family:var(--mono);font-size:12px;white-space:nowrap}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.b{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.b-y{background:var(--yellow-d);color:var(--yellow)}.b-a{background:var(--accent-d);color:var(--accent)}.b-r{background:var(--red-d);color:var(--red)}
.b-g{background:var(--green-d);color:var(--green)}.b-x{background:var(--grey-d);color:var(--muted)}.b-p{background:var(--purple-d);color:var(--purple)}
.code{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid var(--border)}
.fit{display:flex;gap:3px}.fit i{width:6px;height:6px;border-radius:50%;background:var(--border)}.fit i.f{background:var(--accent)}
/* drawer */
.dr{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:var(--card);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .18s;z-index:50;display:flex;flex-direction:column}
.dr.on{transform:none}
.dr-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.dr-h h2{font-size:15px}.x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.dr-b{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}.kv dt{color:var(--muted);font-size:12px}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.notes{white-space:pre-wrap;font-size:13px;line-height:1.6;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px}
.elig-box{border-radius:6px;padding:10px 12px;font-size:13px}
.links a{display:block;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;word-break:break-all}
.resume-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.rc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}.rc h3{font-size:13px}.rc p{font-size:11px;color:var(--muted);margin-bottom:10px}
.ck{display:flex;gap:7px;font-size:12px;margin-bottom:6px}.ok{color:var(--green)}.wa{color:var(--yellow)}.ba{color:var(--red)}.ck span{color:var(--muted)}
.err{display:none;background:var(--red-d);color:var(--red);padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:12px}
@media(max-width:760px){.shell{flex-direction:column;height:auto}.side{width:100%}.nav{display:flex;flex-wrap:wrap}.main{overflow:visible}.stats{grid-template-columns:repeat(2,1fr)}.page{padding:16px}}
</style>
</head>
<body>
<div class="shell">
 <nav class="side">
  <div class="side-h"><b>Michael — Career</b><div>Research &amp; Internship Tracker</div></div>
  <div class="nav">
   <div class="nav-i on" data-p="fellowships">🏛 Fellowships <span class="cnt" id="c-fellowships">—</span></div>
   <div class="nav-i" data-p="grad">🎓 Grad Programs <span class="cnt" id="c-grad">—</span></div>
   <div class="nav-i" data-p="jobs">💼 Jobs <span class="cnt" id="c-jobs">—</span></div>
   <div class="nav-i" data-p="resume">📄 Resumes</div>
  </div>
  <div class="side-f" id="src">Loading…</div>
 </nav>
 <main class="main" id="main"></main>
</div>
<aside class="dr" id="dr"><div class="dr-h"><div id="dr-t"></div><button class="x" onclick="closeDr()">×</button></div><div class="dr-b" id="dr-b"></div></aside>

<script>
const REPO='michaeldatascience/career';
const RAW=`https://raw.githubusercontent.com/${REPO}/main/data/`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const FUND={FF:'Fully funded (tuition + stipend)',TW:'Tuition-free, living self-funded',TA:'Assistantship stipend',LT:'Low tuition',SC:'Scholarship/partial, not guaranteed',SP:'Self-paid'};
const ELIG={OK:['Eligible','b-g'],RISK:['Check','b-y'],BLOCKED:['Blocked','b-r']};
const STATUS={Track:'b-y',Applied:'b-a','Next Round':'b-g',Shortlisted:'b-p',Rejected:'b-r',Closed:'b-x'};
const SECT={
 fellowships:{title:'Fellowships & Internships',sub:'AI safety, research and generalist programmes',cols:['name','location','deadline','fees','funding','elig','status','fit'],feesLabel:'Stipend / Cost',statuses:['Track','Applied','Next Round','Rejected','Closed']},
 grad:{title:'Grad Programs',sub:'Funded or tuition-free MS / MTech / PhD in AI, ML, DS',cols:['name','location','deadline','fees','funding','elig','status','fit'],feesLabel:'Fees',statuses:['Track','Applied','Next Round','Rejected','Closed']},
 jobs:{title:'Jobs',sub:'Active applications and pipeline',cols:['name','location','status','fit'],feesLabel:'',statuses:['Track','Applied','Shortlisted','Rejected']}
};
let data={},filt={fellowships:'all',grad:'all',jobs:'all'},hideBlocked={fellowships:false,grad:false,jobs:false},cur='fellowships',selId=null;

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function urg(d){if(!d)return'none';const x=new Date(d);if(isNaN(x))return'none';x.setHours(0,0,0,0);const n=Math.round((x-TODAY)/864e5);return n<0?'past':n<=7?'crit':n<=30?'soon':'open'}
function days(d){const x=new Date(d);x.setHours(0,0,0,0);return Math.round((x-TODAY)/864e5)}
function fmtD(d){if(!d)return'<span class="dim">—</span>';const x=new Date(d);if(isNaN(x))return esc(d);const l=x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});const u=urg(d);
 if(u==='past')return`<span class="dim">${l} (passed)</span>`;if(u==='crit')return`<span style="color:var(--red)">${l} · ${days(d)}d</span>`;if(u==='soon')return`<span style="color:var(--yellow)">${l} · ${days(d)}d</span>`;return l}
const fitH=f=>{f=+f||0;let h='<div class="fit">';for(let i=1;i<=5;i++)h+=`<i class="${i<=f?'f':''}"></i>`;return h+'</div>'};
const stat=s=>`<span class="b ${STATUS[s]||'b-y'}">${esc(s)}</span>`;
const elig=e=>e?`<span class="b ${ELIG[e]?.[1]||'b-x'}">${ELIG[e]?.[0]||esc(e)}</span>`:'<span class="dim">—</span>';
const fund=f=>f?`<span class="code" title="${esc(FUND[f]||f)}">${esc(f)}</span>`:'<span class="dim">—</span>';

function cell(c,it,s){
 switch(c){
  case'name':return`<td><div class="nm">${esc(it.name)}</div><div class="org">${esc(it.org)}</div></td>`;
  case'location':return`<td class="muted">${esc(it.location||'—')}</td>`;
  case'deadline':return`<td class="dl">${fmtD(it.deadline)}</td>`;
  case'fees':return`<td>${esc(it.fees||'—')}${it.stipend?`<div class="org">${esc(it.stipend)}</div>`:''}</td>`;
  case'funding':return`<td>${fund(it.funding)}</td>`;
  case'elig':return`<td>${elig(it.elig)}</td>`;
  case'status':return`<td>${stat(it.status)}</td>`;
  case'fit':return`<td>${fitH(it.fit)}</td>`;
 }}
const HEAD={name:'Program',location:'Location',deadline:'Deadline',fees:'',funding:'Funding',elig:'Eligibility',status:'Status',fit:'Fit'};

function pageShell(s){
 const c=SECT[s];
 const leg=s==='jobs'?'':`<div class="legend">${Object.entries(FUND).map(([k,v])=>`<span><b class="code">${k}</b> ${v}</span>`).join('')}<span><span class="b b-g">Eligible</span> <span class="b b-y">Check</span> <span class="b b-r">Blocked</span></span></div>`;
 return`<div class="page" id="p-${s}"><div class="ph"><div><h1>${c.title}</h1><p>${c.sub} · click a row for full details</p></div>
 <a href="https://github.com/${REPO}/blob/main/data/${s}.json" target="_blank" style="font-size:12px">View data file ↗</a></div>
 <div class="err" id="e-${s}"></div><div class="stats" id="s-${s}"></div>
 <div class="bar"><button class="fb on" data-f="all">All</button>${c.statuses.map(x=>`<button class="fb" data-f="${x}">${x}</button>`).join('')}
 ${s==='jobs'?'':`<label class="tog"><input type="checkbox" data-hb="${s}"> Hide blocked</label>`}</div>${leg}
 <div class="tw"><table><thead><tr>${c.cols.map(k=>`<th>${k==='fees'?c.feesLabel:HEAD[k]}</th>`).join('')}</tr></thead><tbody id="t-${s}"></tbody></table></div></div>`}

function resumePage(){return`<div class="page" id="p-resume"><div class="ph"><div><h1>Resumes</h1><p>Variants, sync status, outstanding work (static — pending resume audit)</p></div></div>
<div class="resume-grid">
<div class="rc"><h3>General / Balanced</h3><p>Senior IC, CTO, backend / AI infra</p><div class="ck ok">✓<span>Pre-LLM narrative separated</span></div><div class="ck wa">⚠<span>GitHub links missing</span></div><div class="ck ba">✗<span>CGPA 7.8 in file vs 7.5 — reconcile</span></div></div>
<div class="rc"><h3>AI / ML Research</h3><p>Fellowships, MBZUAI, research roles</p><div class="ck ok">✓<span>Education first</span></div><div class="ck ba">✗<span>No public research output yet</span></div><div class="ck ba">✗<span>Portfolio repos not live</span></div></div>
<div class="rc"><h3>JS / TS / Node</h3><p>Buffer, Automattic, Node roles</p><div class="ck ba">✗<span>Not built</span></div></div>
<div class="rc"><h3>PHP / WordPress</h3><p>Automattic, WP ecosystem</p><div class="ck ba">✗<span>Not built</span></div></div>
</div></div>`}

function render(s){
 const items=(data[s]||[]).filter(i=>(filt[s]==='all'||i.status===filt[s])&&!(hideBlocked[s]&&i.elig==='BLOCKED'));
 const cols=SECT[s].cols;
 document.getElementById('t-'+s).innerHTML=items.length?items.map(it=>{const u=urg(it.deadline);
  const cls=[it.elig==='BLOCKED'?'blocked':'',u==='crit'?'red':u==='soon'?'amber':'',selId===it.id?'sel':''].join(' ');
  return`<tr class="${cls}" data-s="${s}" data-id="${esc(it.id)}">${cols.map(c=>cell(c,it,s)).join('')}</tr>`}).join('')
  :`<tr><td colspan="${cols.length}" class="muted" style="text-align:center;padding:36px">No entries.</td></tr>`;
 const all=data[s]||[];
 const n=(f)=>all.filter(f).length;
 document.getElementById('s-'+s).innerHTML=[
  [all.length,'Total'],[n(i=>i.elig!=='BLOCKED'&&['Track','Next Round'].includes(i.status)),'Tracking (viable)'],
  [n(i=>['Applied','Shortlisted'].includes(i.status)),'Applied'],[n(i=>i.elig==='BLOCKED'),'Blocked'],
  [n(i=>i.elig!=='BLOCKED'&&['soon','crit'].includes(urg(i.deadline))),'Deadline ≤30d']
 ].map(([v,l],k)=>`<div class="stat"><b style="${k===4&&v?'color:var(--yellow)':k===3&&v?'color:var(--red)':''}">${v}</b><span>${l}</span></div>`).join('');
 document.getElementById('c-'+s).textContent=n(i=>i.elig!=='BLOCKED'&&!['Rejected','Closed'].includes(i.status));
}

function openDr(s,id){
 const it=(data[s]||[]).find(x=>x.id===id);if(!it)return;selId=id;render(s);
 document.getElementById('dr-t').innerHTML=`<h2>${esc(it.name)}</h2><div class="org">${esc(it.org)}</div>`;
 const e=it.elig,ec=e==='BLOCKED'?'var(--red-d)':e==='RISK'?'var(--yellow-d)':'var(--green-d)';
 const links=(it.links&&it.links.length?it.links:(it.link?[{label:'Official page',url:it.link}]:[]));
 document.getElementById('dr-b').innerHTML=`
 <dl class="kv"><dt>Status</dt><dd>${stat(it.status)}</dd><dt>Deadline</dt><dd class="dl">${fmtD(it.deadline)}</dd>
 ${it.location?`<dt>Location</dt><dd>${esc(it.location)}</dd>`:''}
 ${it.fees?`<dt>${s==='fellowships'?'Stipend / Cost':'Fees'}</dt><dd>${esc(it.fees)}</dd>`:''}
 ${it.stipend?`<dt>Stipend</dt><dd>${esc(it.stipend)}</dd>`:''}
 ${it.funding?`<dt>Funding</dt><dd>${fund(it.funding)} ${esc(FUND[it.funding]||'')}</dd>`:''}
 <dt>Fit</dt><dd>${fitH(it.fit)}</dd></dl>
 ${e?`<div class="sec"><h3>Eligibility</h3><div class="elig-box" style="background:${ec}">${elig(e)} ${esc(it.elig_note||'')}</div></div>`:''}
 <div class="sec"><h3>Notes</h3><div class="notes">${esc(it.notes||'—')}</div></div>
 <div class="sec links"><h3>Links</h3>${links.length?links.map(l=>`<a href="${esc(l.url)}" target="_blank">${esc(l.label)} ↗</a>`).join(''):'<span class="dim">None yet</span>'}</div>`;
 document.getElementById('dr').classList.add('on');
}
function closeDr(){document.getElementById('dr').classList.remove('on');selId=null;render(cur==='resume'?'fellowships':cur)}

function show(p){cur=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));document.querySelectorAll('.nav-i').forEach(x=>x.classList.toggle('on',x.dataset.p===p));closeDr()}

async function init(){
 const m=document.getElementById('main');m.innerHTML=Object.keys(SECT).map(pageShell).join('')+resumePage();
 document.getElementById('p-fellowships').classList.add('on');
 document.querySelectorAll('.nav-i').forEach(n=>n.onclick=()=>show(n.dataset.p));
 m.addEventListener('click',e=>{
  const fb=e.target.closest('.fb');if(fb){const s=fb.closest('.page').id.slice(2);filt[s]=fb.dataset.f;fb.parentNode.querySelectorAll('.fb').forEach(b=>b.classList.toggle('on',b===fb));render(s);return}
  const tr=e.target.closest('tr[data-id]');if(tr)openDr(tr.dataset.s,tr.dataset.id)});
 m.addEventListener('change',e=>{const s=e.target.dataset.hb;if(s){hideBlocked[s]=e.target.checked;render(s)}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});
 for(const s of Object.keys(SECT)){try{const r=await fetch(RAW+s+'.json?t='+Date.now());if(!r.ok)throw Error(r.status);data[s]=await r.json()}catch(err){data[s]=[];const el=document.getElementById('e-'+s);el.textContent='Could not load '+s+'.json ('+err.message+')';el.style.display='block'}render(s)}
 document.getElementById('src').innerHTML=`Data: <a href="https://github.com/${REPO}" target="_blank">${REPO}</a><br>Loaded ${new Date().toLocaleTimeString()}`;
}
init();
</script>
</body>
</html>
